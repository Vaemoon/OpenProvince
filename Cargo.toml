[workspace]
members = ["crates/province-archive"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
aes = "=0.9.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
province-archive = { path = "crates/province-archive" }

[package]
name = "openprovince"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
province-archive.workspace = true
serde_json.workspace = true
eframe = "=0.31.1"
egui_extras = { version = "=0.31.1", default-features = false, features = ["svg"] }
rfd = "=0.15.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "dds", "bmp", "tga"] }

[profile.release]
lto = "thin"
strip = true
